<div class="container">
  <div class="flex flex-row items-center">
    <p class="text-xl font-bold">Checkliste</p>
    <span class="spacer"></span>
    <button mat-icon-button
            matTooltip="neues standard Todo erfassen"
            matTooltipPosition="above"
            routerLink="/checklist/create"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div>
  <mat-divider></mat-divider>

  <mat-action-list>

    @for (todo of todos; track todo; let i = $index) {
      <mat-list-item [routerLink]="['/checklist/', todo.id]" [ngClass]="{'odd-row': i % 2 === 0, 'even-row': i % 2 !== 0}">
        <mat-icon matListItemIcon>article</mat-icon>
        <div matListItemTitle>{{ todo.title }}</div>
      </mat-list-item>
    }
  </mat-action-list>

</div>
