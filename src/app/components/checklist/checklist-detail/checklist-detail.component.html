@if (todo) {
  <div class="container">
    <!-- Header -->
    <div class="flex flex-row items-center">
      <div>
        <button mat-icon-button [routerLink]="['/checklist']">
          <mat-icon>arrow_back</mat-icon>
        </button>
      </div>
      <p class="text-xl font-bold">{{ todo.title }}</p>
      <span class="spacer"></span>

      <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item matTooltip="Todo bearbeiten" matTooltipPosition="above"
                [routerLink]="['/checklist/' + todoId + '/edit']">
          <mat-icon>edit</mat-icon>
          <span>Todo bearbeiten</span>
        </button>
        <button mat-menu-item matTooltip="Todo löschen" matTooltipPosition="above" (click)="deleteTodo()">
          <mat-icon>delete</mat-icon>
          <span>Todo löschen</span>
        </button>
      </mat-menu>
    </div>
    <mat-divider></mat-divider>

    <!-- Content  -->
    <div class="flex flex-col mt-5 border rounded-xl shadow-xl p-2">
      <p class="text-xl font-bold text-blue-500">Typ: <span class="font-bold text-black">{{ todo.type }}</span></p>
      <p class="text-xl font-bold mt-5 text-blue-500">Inhalt</p>
      @switch (todo.type) {
        @case (TYPE.LINK) {
          @for (link of linkContentArr; track link; let i = $index) {
            <div class="flex items-center">
              <a href="{{link}}" target="_blank" rel="noopener noreferrer" class="font-bold flex w-full">{{ link }}</a>
            </div>
          }
        }
        @default {
          <textarea [value]="todo.content"></textarea>
        }
      }
    </div>
  </div>
}
