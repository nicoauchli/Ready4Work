<div class="mt-4 flex flex-col">
  <textarea matInput formControlName="content" cdkTextareaAutosize cdkAutosizeMinRows="20"
            cdkAutosizeMaxRows="100" placeholder="Inhalt" [innerHTML]="sanitizedContent"></textarea>
  <div>
    <button mat-stroked-button color="primary" (click)="copyContent(emailContent[0])" class="mt-4 float-end">In Zwischenablage kopieren</button>
  </div>
</div>
