@if (employeeTodo) {
  <div class="container">
    <!-- Header  -->
    <div class="flex flex-row items-center">
      <div>
        <button mat-icon-button [routerLink]="['/employees', employeeTodo.employeeId]">
          <mat-icon>arrow_back</mat-icon>
        </button>
      </div>
      <p class="text-xl font-bold py-2">{{ employeeTodo.todo.title }}</p>
      @if ( todo && !isDefaultTodo()) {
        <span class="spacer"></span>
        <button mat-icon-button [matMenuTriggerFor]="menu">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item matTooltip="Todo bearbeiten" matTooltipPosition="above"
                  [routerLink]="['/employees/' + employeeTodo.employeeId + '/todos/' + employeeTodo.todoId + '/edit']">
            <mat-icon>edit</mat-icon>
            <span>Todo bearbeiten</span>
          </button>
          <button mat-menu-item matTooltip="Todo löschen" matTooltipPosition="above" (click)="deleteNonDefaultTodo(employeeTodo.todoId)">
            <mat-icon>delete</mat-icon>
            <span>Todo löschen</span>
          </button>
        </mat-menu>
      }
      <mat-divider class="py-1"></mat-divider>
    </div>
    <!-- State -->
    <div
      class="py-10 flex flex-col w-full items-center justify-center border-2 border-neutral-700 rounded-2xl bg-slate-100">
      <p class="text-4xl font-bold">Status</p>
      <p class="text-4xl" [ngClass]="getTodoClass(employeeTodo.state)">{{ employeeTodo.state }}</p>
    </div>
    <!-- Description -->
    <div class="border mt-4 rounded-2xl shadow-xl p-4">

      <div class="my-8 items-center border-b">
        <p class="text-xl font-bold pb-2">Kommentar</p>
        <form [formGroup]="descriptionform" class="w-full flex items-center">
          <mat-form-field class="flex-grow mr-4">
  <textarea
    matInput
    placeholder="Bemerkung"
    formControlName="description"
    class=" w-full overflow-hidden" cdkTextareaAutosize
    (input)="adjustTextareaHeight($event)"
    rows="1"
  ></textarea>
          </mat-form-field>
          <button mat-flat-button color="primary" (click)="saveDescription()">Speichern</button>
        </form>
      </div>
      <!-- Content by type -->
      <div class="w-full items-center">
        <p class="text-xl font-bold pb-2">Inhalt</p>
        @switch (employeeTodo.todo.type) {
          @case (TYPE.TEXT) {
            <app-todo-detail-text [textContent]="employeeTodo.todo.content"></app-todo-detail-text>
          }
          @case (TYPE.MAIL) {
            <app-todo-detail-mail [emailContent]="employeeTodo.todo.content"></app-todo-detail-mail>
          }
          @case (TYPE.LINK) {
            <app-todo-detail-link [linkContent]="employeeTodo.todo.content"></app-todo-detail-link>
          }
        }
      </div>
    </div>
  </div>
}
