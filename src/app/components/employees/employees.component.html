<mat-action-list>
  <div mat-subheader>Mitarbeiter</div>
  <mat-divider></mat-divider>
  @for (employee of employees; track employee) {
    <mat-list-item [routerLink]="['/employees/', employee.id]">
      <mat-icon matListItemIcon>person</mat-icon>
      <div matListItemTitle>{{ employee.firstname + ' ' + employee.lastname}}</div>
    </mat-list-item>
  }
</mat-action-list>
